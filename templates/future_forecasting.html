{% extends 'base.html' %}

{% block content %}

<h1>Strategic Risk Forecasting</h1>

<div class='grid'>

    <!-- ====================================================== -->
    <!-- SCENARIO FORM -->
    <!-- ====================================================== -->

    <div class='card'>

        <h3>Scenario Parameters</h3>

        <form method='POST'>

            <select
                name='country'
                style='width:100%; margin-bottom:1rem;'
            >
                {% for c in countries %}
                    <option value='{{c}}'>{{c}}</option>
                {% endfor %}
            </select>

            <label>GDP Growth</label>

            <input
                type='range'
                name='gdp'
                min='0'
                max='500'
                value='100'
                style='width:100%'
            >

            <label>Stability Index</label>

            <input
                type='range'
                name='stability'
                min='-3'
                max='3'
                step='0.1'
                value='0'
                style='width:100%'
            >

            <label>Military Exp</label>

            <input
                type='number'
                name='milexp'
                value='1000'
                style='width:100%; margin-bottom:1rem;'
            >

            <button
                type='submit'
                style='background:var(--accent-red); width:100%;'
            >
                Simulate Scenario
            </button>

        </form>

    </div>

    {% if results %}

    <!-- ====================================================== -->
    <!-- GAUGE -->
    <!-- ====================================================== -->

    <div class='card'>

        <div id='riskGauge'></div>

    </div>

    <!-- ====================================================== -->
    <!-- SHAP -->
    <!-- ====================================================== -->

    <div class='card'>

        <h3>Primary Instability Drivers</h3>

        <div id='shapChart'></div>

    </div>

    <!-- ====================================================== -->
    <!-- REPORT -->
    <!-- ====================================================== -->

    <div class='card' style='grid-column: 1 / -1;'>

        <h3>Intelligence Brief</h3>

        <pre style='
            white-space: pre-wrap;
            font-family: inherit;
            color: var(--text-secondary);
        '>{{ results.report }}</pre>

    </div>

    <!-- ====================================================== -->
    <!-- PLOTLY -->
    <!-- ====================================================== -->

    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

    <script>

    document.addEventListener("DOMContentLoaded", function () {

        /* ===================================================== */
        /* GAUGE CHART */
        /* ===================================================== */

        try {

            const gaugeData = {{ results.gauge | safe }};

            if (
                gaugeData &&
                gaugeData.data
            ) {

                Plotly.newPlot(
                    'riskGauge',
                    gaugeData.data,
                    gaugeData.layout,
                    {responsive: true}
                );

                console.log("Gauge chart rendered.");

            } else {

                console.log("Gauge data missing.");

            }

        } catch (err) {

            console.error("Gauge render failed:", err);

        }

        /* ===================================================== */
        /* SHAP CHART */
        /* ===================================================== */

        try {

            const shapData = {{ results.shap_chart | safe }};

            if (
                shapData &&
                shapData.data &&
                shapData.data.length > 0
            ) {

                Plotly.newPlot(
                    'shapChart',
                    shapData.data,
                    shapData.layout,
                    {responsive: true}
                );

                console.log("SHAP chart rendered.");

            } else {

                document.getElementById("shapChart").innerHTML = `
                    <div style="
                        color:#94a3b8;
                        padding-top:100px;
                        text-align:center;
                        font-size:16px;
                    ">
                        No significant instability drivers identified.
                    </div>
                `;

            }

        } catch (err) {

            console.error("SHAP render failed:", err);

            document.getElementById("shapChart").innerHTML = `
                <div style="
                    color:#94a3b8;
                    padding-top:100px;
                    text-align:center;
                    font-size:16px;
                ">
                    Instability analysis temporarily unavailable.
                </div>
            `;

        }

    });

    </script>

    {% endif %}

</div>

{% endblock %}
